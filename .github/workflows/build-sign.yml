
name: Build, Sign and Attest Juice Shop

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sr-isaac-935/juice-shop-sigstore-lab

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sr-isaac-935/juice-shop-sigstore-lab:1.0

      - name: Sign image with Cosign
        env:
          IMAGE: ghcr.io/sr-isaac-935/juice-shop-sigstore-lab
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/sr-isaac-935/juice-shop-sigstore-lab
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
